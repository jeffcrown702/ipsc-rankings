name: Keep Vercel Warm

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Vercel warm + 分步爬取
        run: |
          curl -s --max-time 10 "https://ipsc-rankings.vercel.app/api/cron/keepwarm" || true
          # 每分鐘爬 1 個未完成 shooter（輕量，且唔 recalc，rec功能由本地 cron 負責）
          curl -s --max-time 15 -X POST "https://ipsc-rankings.vercel.app/api/scrape/step" || true
